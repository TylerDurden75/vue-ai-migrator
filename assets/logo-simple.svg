    <line x1="0" y1="-6" x2="8" y2="0" stroke="#3B82F6" stroke-width="1" opacity="0.7"/>
    <line x1="8" y1="0" x2="0" y2="6" stroke="#3B82F6" stroke-width="1" opacity="0.7"/>
