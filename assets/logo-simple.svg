    <!-- Arrow -->
    <path d="M 22 0 L 38 0 L 33 -5 M 38 0 L 33 5" stroke="#4FC08D" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- Vue 3 Circle -->
