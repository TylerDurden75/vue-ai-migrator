<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#4FC08D" opacity="0.1"/>
  
  <!-- Vue 2 to Vue 3 Arrow -->
  <g transform="translate(50, 100)">
    <!-- Vue 2 Circle -->
    <circle cx="0" cy="0" r="25" fill="#4FC08D" opacity="0.8"/>
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">2</text>
    
    <!-- Arrow -->
    <path d="M 30 0 L 70 0 L 60 -10 M 70 0 L 60 10" stroke="#4FC08D" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- Vue 3 Circle -->
    <circle cx="100" cy="0" r="25" fill="#42B883"/>
    <text x="100" y="8" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">3</text>
  </g>
  
  <!-- AI Symbol (Brain/Chip) -->
  <g transform="translate(100, 50)">
    <!-- Neural network nodes -->
    <circle cx="-15" cy="0" r="4" fill="#3B82F6"/>
    <circle cx="0" cy="-10" r="4" fill="#3B82F6"/>
    <circle cx="15" cy="0" r="4" fill="#3B82F6"/>
    <circle cx="0" cy="10" r="4" fill="#3B82F6"/>
    
    <!-- Connections -->
    <line x1="-15" y1="0" x2="0" y2="-10" stroke="#3B82F6" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="-10" x2="15" y2="0" stroke="#3B82F6" stroke-width="1.5" opacity="0.6"/>
    <line x1="15" y1="0" x2="0" y2="10" stroke="#3B82F6" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="10" x2="-15" y2="0" stroke="#3B82F6" stroke-width="1.5" opacity="0.6"/>
    <line x1="-15" y1="0" x2="15" y2="0" stroke="#3B82F6" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#3B82F6" stroke-width="1.5" opacity="0.6"/>
  </g>
  
  <!-- AST Symbol (Tree structure) -->
  <g transform="translate(100, 150)">
    <!-- Root -->
    <circle cx="0" cy="0" r="3" fill="#4FC08D"/>
    <!-- Branches -->
    <line x1="0" y1="0" x2="-20" y2="-15" stroke="#4FC08D" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="-15" stroke="#4FC08D" stroke-width="2"/>
    <line x1="0" y1="0" x2="20" y2="-15" stroke="#4FC08D" stroke-width="2"/>
    <!-- Leaves -->
    <circle cx="-20" cy="-15" r="3" fill="#4FC08D"/>
    <circle cx="0" cy="-15" r="3" fill="#4FC08D"/>
    <circle cx="20" cy="-15" r="3" fill="#4FC08D"/>
  </g>
</svg>
