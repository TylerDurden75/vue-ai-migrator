codecov:
  token: # Will be set in GitHub Actions secrets
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: '70...100'

  status:
    project:
      default:
        target: 70%
        threshold: 1%
        base: auto
    patch:
      default:
        target: 70%
        threshold: 1%

comment:
  layout: 'reach,diff,flags,tree,reach'
  behavior: default
  require_changes: false

ignore:
  - '**/*.test.ts'
  - '**/*.spec.ts'
  - '**/__tests__/**'
  - '**/dist/**'
  - '**/node_modules/**'
